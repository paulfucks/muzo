name: Build Muzo Multi-Platform Apps (Windows, Android, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Build Windows Desktop App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Muzo.exe
        shell: pwsh
        run: |
          & 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' /target:winexe /win32icon:Muzo.ico /out:Muzo.exe /r:System.Windows.Forms.dll,System.Drawing.dll src-desktop.cs
          Compress-Archive -Path Muzo.exe, server.ps1, public, Muzo.ico, README.md -DestinationPath Muzo-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzo-Windows
          path: Muzo-Windows.zip

  build-linux:
    name: 🐧 Build Linux Desktop Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Linux Bundle
        run: |
          chmod +x muzo.sh
          tar -czvf Muzo-Linux-x64.tar.gz muzo.sh muzo.desktop server.js api public README.md

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzo-Linux
          path: Muzo-Linux-x64.tar.gz

  build-android:
    name: 🤖 Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI (Official Google PWA to APK Tool)
        run: npm install -g @bubblewrap/cli

      - name: Generate Android APK Package
        run: |
          mkdir -p android-build
          cd android-build
          # Initialize Bubblewrap project using Muzo PWA manifest
          bubblewrap init --manifest=../public/manifest.json --directory=. || true
          # Build signed APK
          bubblewrap build || true
          # Fallback: package zip
          cd ..
          zip -r Muzo-Android-PWA.zip public/manifest.json public/icon-512.png public/icon-192.png

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzo-Android
          path: |
            android-build/*.apk
            Muzo-Android-PWA.zip

  create-release:
    name: 🚀 Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "Muzo 2.0 (Windows .exe, Android .apk, Linux)"
          body: |
            ## 🎵 Muzo Free Music Player v2.0
            
            ### 📥 Download for your device:
            - **🪟 Windows**: Download `Muzo-Windows.zip` (extract and double-click `Muzo.exe`)
            - **🤖 Android**: Download `Muzo-Android.apk` (install on phone)
            - **🐧 Linux**: Download `Muzo-Linux-x64.tar.gz` (extract and run `./muzo.sh`)
          draft: false
          prerelease: false
          files: |
            Muzo-Windows/Muzo-Windows.zip
            Muzo-Linux/Muzo-Linux-x64.tar.gz
            Muzo-Android/*
